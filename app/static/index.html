<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Document Assistant</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f7f9;
        --panel: #ffffff;
        --text: #17202a;
        --muted: #5d6b7a;
        --line: #d9e0e8;
        --accent: #0f766e;
        --accent-strong: #115e59;
        --danger: #b42318;
        --source: #eef6ff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(1120px, calc(100% - 32px));
        margin: 0 auto;
        padding: 32px 0;
      }

      header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 20px;
      }

      h1 {
        margin: 0;
        font-size: 28px;
        line-height: 1.15;
        letter-spacing: 0;
      }

      .status {
        color: var(--muted);
        font-size: 14px;
        white-space: nowrap;
      }

      .layout {
        display: grid;
        grid-template-columns: 360px 1fr;
        gap: 18px;
        align-items: start;
      }

      section {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 18px;
      }

      h2 {
        margin: 0 0 14px;
        font-size: 16px;
        letter-spacing: 0;
      }

      label {
        display: block;
        margin-bottom: 8px;
        color: var(--muted);
        font-size: 14px;
      }

      input[type="file"],
      textarea,
      input[type="number"] {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
        color: var(--text);
        font: inherit;
      }

      input[type="file"] {
        padding: 10px;
      }

      textarea {
        min-height: 126px;
        resize: vertical;
        padding: 12px;
        line-height: 1.45;
      }

      input[type="number"] {
        padding: 10px;
      }

      button {
        min-height: 42px;
        border: 0;
        border-radius: 6px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-weight: 650;
        cursor: pointer;
        padding: 0 16px;
      }

      button:hover {
        background: var(--accent-strong);
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }

      .stack {
        display: grid;
        gap: 14px;
      }

      .row {
        display: grid;
        grid-template-columns: 120px 1fr;
        gap: 12px;
        align-items: end;
      }

      .message {
        min-height: 22px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.4;
      }

      .message.error {
        color: var(--danger);
      }

      .answer {
        min-height: 160px;
        line-height: 1.55;
        white-space: pre-wrap;
      }

      .sources {
        display: grid;
        gap: 10px;
        margin-top: 16px;
      }

      .source {
        border: 1px solid #c7dff8;
        border-radius: 6px;
        background: var(--source);
        padding: 12px;
      }

      .source-title {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 6px;
        color: #12365a;
        font-weight: 700;
        font-size: 14px;
      }

      .source p {
        margin: 0;
        color: #213547;
        font-size: 14px;
        line-height: 1.45;
      }

      @media (max-width: 820px) {
        main {
          width: min(100% - 24px, 680px);
          padding: 22px 0;
        }

        header,
        .layout {
          display: grid;
          grid-template-columns: 1fr;
        }

        .status {
          white-space: normal;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>AI Document Assistant</h1>
        <div class="status" id="health">Checking service...</div>
      </header>

      <div class="layout">
        <section>
          <h2>PDF</h2>
          <form id="uploadForm" class="stack">
            <div>
              <label for="pdfFile">File</label>
              <input id="pdfFile" name="file" type="file" accept="application/pdf,.pdf" />
            </div>
            <button id="uploadButton" type="submit">Upload</button>
            <div id="uploadMessage" class="message"></div>
          </form>
        </section>

        <section>
          <h2>Question</h2>
          <form id="askForm" class="stack">
            <div>
              <label for="question">Ask</label>
              <textarea id="question" name="question" placeholder="What does the document say about..."></textarea>
            </div>
            <div class="row">
              <div>
                <label for="topK">Top K</label>
                <input id="topK" name="topK" type="number" min="1" max="10" value="4" />
              </div>
              <button id="askButton" type="submit">Ask</button>
            </div>
          </form>

          <h2 style="margin-top: 22px">Answer</h2>
          <div id="answer" class="answer">Upload a PDF, then ask a question.</div>
          <div id="askMessage" class="message"></div>
          <div id="sources" class="sources"></div>
        </section>
      </div>
    </main>

    <script>
      const health = document.querySelector("#health");
      const uploadForm = document.querySelector("#uploadForm");
      const askForm = document.querySelector("#askForm");
      const uploadMessage = document.querySelector("#uploadMessage");
      const askMessage = document.querySelector("#askMessage");
      const answer = document.querySelector("#answer");
      const sources = document.querySelector("#sources");
      const uploadButton = document.querySelector("#uploadButton");
      const askButton = document.querySelector("#askButton");

      async function loadHealth() {
        try {
          const response = await fetch("/health");
          const data = await response.json();
          health.textContent = `${data.documents_indexed} documents · ${data.chunks_indexed} chunks · ${data.embedding_provider}/${data.llm_provider}`;
        } catch {
          health.textContent = "Service unavailable";
        }
      }

      function setMessage(element, text, isError = false) {
        element.textContent = text;
        element.classList.toggle("error", isError);
      }

      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, (character) => {
          const replacements = {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;",
          };
          return replacements[character];
        });
      }

      async function readError(response) {
        try {
          const body = await response.json();
          return body.detail || response.statusText;
        } catch {
          return response.statusText;
        }
      }

      uploadForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        setMessage(uploadMessage, "");

        const fileInput = document.querySelector("#pdfFile");
        if (!fileInput.files.length) {
          setMessage(uploadMessage, "Choose a PDF file.", true);
          return;
        }

        const formData = new FormData();
        formData.append("file", fileInput.files[0]);
        uploadButton.disabled = true;
        uploadButton.textContent = "Uploading";

        try {
          const response = await fetch("/upload", { method: "POST", body: formData });
          if (!response.ok) {
            throw new Error(await readError(response));
          }
          const data = await response.json();
          setMessage(uploadMessage, `${data.filename}: ${data.pages} pages, ${data.chunks} chunks indexed.`);
          await loadHealth();
        } catch (error) {
          setMessage(uploadMessage, error.message, true);
        } finally {
          uploadButton.disabled = false;
          uploadButton.textContent = "Upload";
        }
      });

      askForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        setMessage(askMessage, "");
        sources.innerHTML = "";

        const question = document.querySelector("#question").value.trim();
        const topK = Number(document.querySelector("#topK").value || 4);
        if (question.length < 3) {
          setMessage(askMessage, "Enter a longer question.", true);
          return;
        }

        askButton.disabled = true;
        askButton.textContent = "Asking";
        answer.textContent = "Thinking...";

        try {
          const response = await fetch("/ask", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ question, top_k: topK }),
          });
          if (!response.ok) {
            throw new Error(await readError(response));
          }

          const data = await response.json();
          answer.textContent = data.answer;
          sources.innerHTML = data.sources
            .map(
              (source, index) => `
                <article class="source">
                  <div class="source-title">
                    <span>Source ${index + 1}</span>
                    <span>${escapeHtml(source.filename)}</span>
                    <span>page ${escapeHtml(source.page)}</span>
                    <span>score ${escapeHtml(source.score)}</span>
                  </div>
                  <p>${escapeHtml(source.preview)}</p>
                </article>
              `,
            )
            .join("");
        } catch (error) {
          answer.textContent = "";
          setMessage(askMessage, error.message, true);
        } finally {
          askButton.disabled = false;
          askButton.textContent = "Ask";
        }
      });

      loadHealth();
    </script>
  </body>
</html>
